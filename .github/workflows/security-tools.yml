    security_dast:
      name: security dast scan
      runs-on: ubuntu-24.04
      steps:         
      - name: ZAP Scan
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
              -t https://petstore.swagger.io/ -J testreport.json -r testreport.html
      - name: Upload ZAP Report HTML
        uses: actions/upload-artifact@v4
        with:
            name: zap-report-html
            path: testreport.html