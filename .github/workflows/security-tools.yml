name: Pipeline devsecops
#evento
on: 
    push:
        branches:
            - eko-demo-python
            - develop
            - staging
    pull_request:
        branches:
            - eko-demo-python
            - master
            - main
    workflow_dispatch:

#jobs
jobs:
    #job1
    init:
        name: Init
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

#gitleaks secret tools
    security_secret:
        name: Security Secret
        runs-on: ubuntu-latest
        needs: init
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Install Gitleaks
              run: |
                    wget https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
                    tar -xzf gitleaks_8.28.0_linux_x64.tar.gz
                    chmod +x gitleaks
                    sudo mv gitleaks /usr/local/bin/
            - name: Gitleak scan
              run: |
                    gitleaks detect --source . --verbose --report-path gitleaks-report.json --exit-code=0
            
            - name: Upload Gitleaks Report
              uses: actions/upload-artifact@v4
              with:
                  name: gitleaks-report
                  path: gitleaks-report.json
#security SAST
    security_sast:
        name: Security SAST
        runs-on: ubuntu-latest
        needs: init
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                  pip install bandit
            - name: Run Bandit
              run: |
                  bandit -r . -f json -o bandit-report.json || true

    security_sast_semgrep:
        name: Security Semgrep
        runs-on: ubuntu-latest
        needs: init
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                  pip install semgrep
            - name: Run Semgrep
              run: |
                  semgrep --config auto . --json --output semgrep-report.json || true

            - name: Upload Semgrep Report
              uses: actions/upload-artifact@v4
              with:
                  name: semgrep-report
                  path: semgrep-report.json
###sca
    security_sca_py-audit:
        name: Security pip audit scan SCA
        runs-on: ubuntu-latest
        needs: init
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.11'

            - name: Install dependencies
              run: |
                  pip install pip-audit
            - name: Run pip-audit
              run: |
                  pip-audit -r requirements.txt --format=json --output=pip-audit-report.json || true

            - name: Upload pip-audit Report
              uses: actions/upload-artifact@v4
              
    test:
        name: test ssh
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Execute remote SSH commands using SSH key
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME }}
                key: ${{ secrets.KEY }}
                port: ${{ secrets.PORT }}
                script: whoami
