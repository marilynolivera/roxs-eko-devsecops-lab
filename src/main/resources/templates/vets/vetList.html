<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

<body>

<div class="container">
  <div class="row">
    <div class="col-md-12">
      <div class="card page-enter" style="margin-top: 30px;">
        <div class="card-header">
          <h2 style="margin: 0; display: flex; align-items: center; gap: 10px;">
            <span class="fa fa-user-md"></span>
            👨‍⚕️ Our Elite Veterinary Team
          </h2>
        </div>
        <div class="card-body" style="padding: 40px;">
          <p style="color: #6c757d; margin-bottom: 30px; font-size: 1.1rem;">
            🏥 Meet our highly trained veterinary professionals dedicated to providing the best care for your pets.
          </p>

          <table id="vets" class="table table-striped">
            <thead>
            <tr>
              <th style="width: 40%;">
                <span class="fa fa-user"></span> Name
              </th>
              <th style="width: 60%;">
                <span class="fa fa-stethoscope"></span> Specialties
              </th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="vet : ${listVets}">
              <td>
                <strong style="color: #1a1a2e; font-size: 1.1rem;" th:text="${vet.firstName + ' ' + vet.lastName}"></strong>
              </td>
              <td>
                <span th:each="specialty : ${vet.specialties}" class="badge-custom" 
                      style="margin-right: 8px; display: inline-block; margin-bottom: 5px;"
                      th:text="${specialty.name}"/>
                <span th:if="${vet.nrOfSpecialties == 0}" 
                      style="color: #6c757d; font-style: italic;">
                  General Practice
                </span>
              </td>
            </tr>
            </tbody>
          </table>


          <!-- Enhanced Pagination -->
          <div th:if="${totalPages > 1}" style="margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 15px; text-align: center;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;">
              <span style="font-weight: 600; color: #1a1a2e; margin-right: 10px;">Pages:</span>
              
              <a th:if="${currentPage > 1}" th:href="@{'/vets.html/?page=1'}" title="First"
                 class="btn btn-sm" style="background: white; border: 2px solid #e0e0e0; padding: 8px 12px;">
                <span class="fa fa-fast-backward"></span>
              </a>
              <span th:unless="${currentPage > 1}" title="First" 
                    style="padding: 8px 12px; color: #ccc;">
                <span class="fa fa-fast-backward"></span>
              </span>
              
              <a th:if="${currentPage > 1}" th:href="@{'/vets.html/?page=' + ${currentPage - 1}}" title="Previous"
                 class="btn btn-sm" style="background: white; border: 2px solid #e0e0e0; padding: 8px 12px;">
                <span class="fa fa-step-backward"></span>
              </a>
              <span th:unless="${currentPage > 1}" title="Previous" 
                    style="padding: 8px 12px; color: #ccc;">
                <span class="fa fa-step-backward"></span>
              </span>
              
              <span th:each="i: ${#numbers.sequence(1, totalPages)}" style="margin: 0 3px;">
                <a th:if="${currentPage != i}" th:href="@{'/vets.html/?page=' + ${i}}"
                   class="btn btn-sm" 
                   style="background: white; border: 2px solid #e0e0e0; padding: 8px 15px; min-width: 40px;">
                  [[${i}]]
                </a>
                <span th:unless="${currentPage != i}" 
                      style="background: linear-gradient(135deg, #e76f51 0%, #f77f00 100%); color: white; padding: 8px 15px; border-radius: 50px; font-weight: 700; display: inline-block; min-width: 40px;">
                  [[${i}]]
                </span>
              </span>
              
              <a th:if="${currentPage < totalPages}" th:href="@{'/vets.html/?page=' + ${currentPage + 1}}" title="Next"
                 class="btn btn-sm" style="background: white; border: 2px solid #e0e0e0; padding: 8px 12px;">
                <span class="fa fa-step-forward"></span>
              </a>
              <span th:unless="${currentPage < totalPages}" title="Next" 
                    style="padding: 8px 12px; color: #ccc;">
                <span class="fa fa-step-forward"></span>
              </span>
              
              <a th:if="${currentPage < totalPages}" th:href="@{'/vets.html/?page=' + ${totalPages}}" title="Last"
                 class="btn btn-sm" style="background: white; border: 2px solid #e0e0e0; padding: 8px 12px;">
                <span class="fa fa-fast-forward"></span>
              </a>
              <span th:unless="${currentPage < totalPages}" title="Last" 
                    style="padding: 8px 12px; color: #ccc;">
                <span class="fa fa-fast-forward"></span>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
