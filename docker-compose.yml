
services:
  vulnerable_node:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - STAGE=DOCKER
    depends_on:
      - db
    ports:
      - "3000:3000"

  db:
    restart: always
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./services/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
